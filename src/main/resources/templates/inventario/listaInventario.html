<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Inventario Técnico - TareasApp</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        .navbar-brand { font-weight: 700; letter-spacing:.2px }
        .nne-tag { font-family: monospace; background: #f8f9fa; border: 1px solid #dee2e6; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .tech-info { font-size: 0.82rem; color: #6c757d; }
        .table thead th { background-color: #f8f9fa; text-transform: uppercase; font-size: 0.72rem; color: #495057; }
        .account-code { font-size: 0.85rem; color: #0d6efd; background-color: #f0f7ff; padding: 1px 4px; border-radius: 3px; border: 1px solid #cfe2ff; }
        [data-bs-theme="dark"] .nne-tag { background: #2b3035; border-color: #495057; }

        /* Estilo para resaltar el buscador */
        .search-container {
            max-width: 400px;
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/tareas/hoy">TareasApp</a>
        <div class="collapse navbar-collapse" id="topbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="/inventario">Inventario</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="mb-0">Inventario de Equipos</h4>
            <p class="text-muted small mb-0">Gestión de hardware y conectividad</p>
        </div>
        <button class="btn btn-primary shadow-sm" onclick="prepararCrear()" data-bs-toggle="modal" data-bs-target="#modalEquipo">
            <i class="bi bi-plus-lg"></i> Nuevo Equipo
        </button>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-3">
            <div class="search-container">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input type="text" id="tablaBuscador" class="form-control border-start-0 bg-light"
                           placeholder="Buscar por NNE, equipo, responsable u oficina...">
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="ps-3" style="width: 12%">ID / N.N.E</th>
                    <th style="width: 10%">Red</th>
                    <th style="width: 23%">Equipo / Hardware</th>
                    <th style="width: 10%">Tipo</th>
                    <th style="width: 15%">Oficina</th>
                    <th style="width: 20%">Responsable / Cuenta</th>
                    <th class="text-end pe-3" style="width: 10%">Acciones</th>
                </tr>
                </thead>
                <tbody id="cuerpoTabla">
                <tr th:each="e : ${equipos}">
                    <td class="ps-3">
                        <small class="text-muted d-block" th:text="'#' + ${e.id}"></small>
                        <span class="nne-tag text-primary" th:text="${e.nne ?: 'S/N'}"></span>
                    </td>
                    <td>
                            <span th:classappend="${e.red == 'Internet'} ? 'badge bg-success' : 'badge bg-warning text-dark'"
                                  th:text="${e.red}"></span>
                    </td>
                    <td>
                        <div class="fw-bold text-dark" th:text="${e.nombreEquipo ?: 'SIN NOMBRE'}"></div>
                        <div class="tech-info" th:text="${e.descripcion}"></div>
                    </td>
                    <td><span class="badge bg-info text-dark" th:text="${e.tipo}"></span></td>
                    <td>
                        <i class="bi bi-building text-secondary me-1"></i>
                        <span th:text="${e.oficina}"></span>
                    </td>
                    <td>
                        <div class="fw-medium text-dark" th:text="${e.destino}"></div>
                        <code class="account-code" th:text="${e.cuentaUsuario ?: '---'}"></code>
                    </td>
                    <td class="text-end pe-3">
                        <div class="btn-group">
                            <button type="button" class="btn btn-sm btn-outline-primary border-0"
                                    th:onclick="'editarEquipo(' + ${e.id} + ')'">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <form th:action="@{'/inventario/eliminar/' + ${e.id}}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Seguro que desea eliminar este equipo?');">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger border-0">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr id="sinResultados" style="display: none;">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-search fs-2 d-block mb-2"></i>
                        No se encontraron equipos que coincidan con la búsqueda.
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(equipos)}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-database-exclamation fs-1 d-block mb-2"></i> No hay equipos registrados.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEquipo" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <form th:action="@{/inventario/guardar}" method="post" class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">Nueva Ficha de Equipo</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="id" id="edit_id">

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">N.N.E</label>
                        <input type="text" name="nne" id="edit_nne" class="form-control" placeholder="Ej: 102-24">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">Red</label>
                        <select name="red" id="edit_red" class="form-select">
                            <option value="Internet">Internet</option>
                            <option value="Rina">Rina</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">Tipo</label>
                        <select name="tipo" id="edit_tipo" class="form-select">
                            <option value="PC">PC / Escritorio</option>
                            <option value="LAPTOP">Laptop</option>
                            <option value="MONITOR">Monitor</option>
                            <option value="IMPRESORA">Impresora</option>
                            <option value="SCANNER">Scanner</option>
                            <option value="OTRO">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Nombre Equipo (Hostname)</label>
                        <input type="text" name="nombreEquipo" id="edit_nombre" class="form-control" placeholder="PC-ADMIN-01">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Cuenta Usuario</label>
                        <input type="text" name="cuentaUsuario" id="edit_cuenta" class="form-control" placeholder="admin_rina">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label fw-bold small">Descripción del Hardware</label>
                        <input type="text" name="descripcion" id="edit_desc" class="form-control" placeholder="Ej: Monitor 24' HP y CPU i5" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Oficina / Sector</label>
                        <input type="text" name="oficina" id="edit_oficina" class="form-control" placeholder="Nombre de oficina" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Responsable (Destino)</label>
                        <input type="text" name="destino" id="edit_destino" class="form-control" placeholder="Nombre del responsable" required>
                    </div>
                </div>
            </div>
            <div class="modal-footer bg-light border-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary px-4">Guardar Datos</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/inventario.js}"></script>
<th:block th:replace="~{fragments/theme :: theme-toggle-script}"></th:block>

</body>
</html>
